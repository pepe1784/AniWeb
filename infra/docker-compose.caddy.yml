# Override para HTTPS automatico con Caddy frente al servicio web (nginx).
#
# Requisitos:
#   - Un dominio (o subdominio) con DNS apuntando al servidor.
#   - Puertos 80 y 443 abiertos (Caddy emite Let's Encrypt).
#
# Uso:
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.caddy.yml up -d --build
#
# Alternativa sin abrir puertos: Cloudflare Tunnel (ver docs/03-despliegue.md).

services:
  caddy:
    image: caddy:2-alpine
    depends_on:
      - web
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      - "443:443/udp"
    environment:
      DOMAIN: "${DOMAIN:?Define DOMAIN en infra/.env (ej: aniweb.tudominio.com)}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config: