server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Healthcheck usado por el Dockerfile y el compose
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Cabeceras de seguridad base
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Assets con hash: cache larga e inmutable
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # El Service Worker NO se cachea nunca (si se cachea, la PWA no se actualiza)
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  # SPA fallback: rutas de cliente -> index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}