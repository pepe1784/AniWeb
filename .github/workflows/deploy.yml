name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos minimos para publicar en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build WebUI
        run: pnpm build
        env:
          # Base path para la WebUI (ver ADR-009):
          #   "/"            -> raiz de dominio (user site / servidor Suwayomi)
          #   "/<nombre>/"   -> project site (ej: /AniWeb/)
          # La WebUI inyecta <base href="VITE_BASE_PATH"> (web/vite.config.ts).
          VITE_BASE_PATH: ${{ github.event.repository.name != github.repository_owner && format('/{0}/', github.event.repository.name) || '/' }}

      - name: Prepare GitHub Pages assets
        run: |
          touch build/.nojekyll
          cp build/index.html build/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
